; Lokal Direnç LoRa istasyonu. Hedef: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262).
; Başka kart için src/config.h içindeki pinleri ve bu ortamı değiştirin.
[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2
    h2zero/NimBLE-Arduino@1.4.3
